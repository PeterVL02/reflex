[project]
name = "reflex"
version = "0.1.0"
description = "REFLEX: Rapid Ensemble of Frozen and Learned EXperts - a fast, leakage-aware prompt-injection screening layer"
readme = "README.md"
authors = [
    { name = "PeterVL02", email = "p.vesterenglarsen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "laya>=0.4.19",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "transformers>=5.22.1",
]

[project.scripts]
reflex = "reflex:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
